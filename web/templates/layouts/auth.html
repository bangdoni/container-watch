{{ define "auth" }}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111217">
  <title>{{ .Title }} · ContainerWatch</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/alpine.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark">{{ icon "box" }}</span>
        <span>ContainerWatch</span>
      </div>
      <p class="auth-sub">{{ .Subtitle }}</p>
      {{ if .Error }}<div class="alert alert-error mb-3">{{ icon "alert" }}<span>{{ .Error }}</span></div>{{ end }}
      {{ template "content" . }}
    </div>
    <div class="mt-4 text-center text-xs text-disabled" style="position:fixed;bottom:14px">
      ContainerWatch {{ .Version }} · self-hosted container observability
    </div>
  </div>
  {{ template "toast-root" . }}
</body>
</html>
{{ end }}
