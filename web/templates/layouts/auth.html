{{ define "auth" }}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111217">
  <title>{{ .Title }} · ContainerWatch</title>
  <link rel="icon" href="{{ asset "img/favicon.svg" }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset "css/app.css" }}">
  <script src="{{ asset "js/htmx.min.js" }}" defer></script>
  <!-- Alpine must be loaded last: it self-starts from a microtask and needs
       every `alpine:init` listener already registered. -->
  <script src="{{ asset "js/app.js" }}" defer></script>
  <script src="{{ asset "js/alpine.min.js" }}" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 256 256" fill="none"><g fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="butt"><path d="M168 66.2A80 80 0 1 0 168 189.8"/></g><path fill="currentColor" d="M96 92h34l30 30 30-30h34l-42 60h-32zM138 152h34l-34 52h-34z"/></svg>
        </span>
        <span>ContainerWatch</span>
      </div>
      <p class="auth-sub">{{ .Subtitle }}</p>
      {{ if .Error }}<div class="alert alert-error mb-3">{{ icon "alert" }}<span>{{ .Error }}</span></div>{{ end }}
      {{ template "content" . }}
    </div>
    <div class="mt-4 text-center text-xs text-disabled" style="position:fixed;bottom:14px">
      ContainerWatch {{ .Version }} · self-hosted container observability
    </div>
  </div>
  {{ template "toast-root" . }}
</body>
</html>
{{ end }}
